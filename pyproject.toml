[project]
name = "njtech-oss-namelist"
version = "0.1.0"
description = "Nanjing Tech University public open-source repository directory"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
  "Django>=5.2,<5.3", "django-allauth[socialaccount]>=65.13,<66", "django-unfold>=0.70,<1",
  "gunicorn>=23,<24", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1",
  "whitenoise>=6.12,<7",
  "celery[redis]>=5.5,<6", "django-celery-beat>=2.8,<3", "redis>=6,<8",
  "cryptography>=45,<48", "Pillow>=11,<13", "django-storages[s3]>=1.14,<2",
  "markdown-it-py>=4,<5", "nh3>=0.3,<1", "django-ratelimit>=4.1,<5",
  "django-widget-tweaks==1.5.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "pytest-httpx>=0.35,<1", "playwright>=1.55,<2", "ruff>=0.14,<1"]
scanner = ["scancode-toolkit>=32.4,<33"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["scancode: requires the real ScanCode runtime", "e2e: browser acceptance tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

