# Explicit development-only overlay. No production server secret files are mounted.
# docker compose -p njtech-ops-smoke -f compose.yaml -f deploy/compose.local.yaml up --build
x-local-env: &local-env
  DJANGO_DEBUG: '1'
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  CSRF_TRUSTED_ORIGINS: http://localhost:18000,http://127.0.0.1:18000
  SITE_BASE_URL: http://localhost:18000
  TRUST_EDGE_CLIENT_IP: '0'
  DJANGO_SECRET_KEY_FILE: ''
  APP_ENCRYPTION_KEY_FILE: ''
  BOOTSTRAP_SECRET_FILE: ''
  POSTGRES_PASSWORD_FILE: ''
  DJANGO_SECRET_KEY: local-development-not-for-deployment
  APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
  BOOTSTRAP_SECRET: local-development-bootstrap
  POSTGRES_DB: namelist
  POSTGRES_USER: namelist
  POSTGRES_PASSWORD: local-development-password
  POSTGRES_HOST: db
  POSTGRES_PORT: '5432'
  REDIS_URL: redis://redis:6379/0
  WORK_ROOT: /app/var/work
  TZ: Asia/Shanghai
services:
  db:
    environment:
      BACKUP_ENABLED: '0'
      POSTGRES_PASSWORD_FILE: ''
      POSTGRES_PASSWORD: local-admin-not-for-deployment
      APP_DB_PASSWORD_FILE: ''
      APP_DB_PASSWORD: local-development-password
    secrets: !reset []
  initialize:
    environment: *local-env
    secrets: !reset []
  web:
    environment: *local-env
    secrets: !reset []
  static:
    ports: ['127.0.0.1:18001:8080']
  worker:
    environment: *local-env
    secrets: !reset []
  scanner:
    environment: *local-env
    secrets: !reset []
    command: [celery, -A, config, worker, --loglevel=INFO, --queues=scan, --concurrency=1, --max-tasks-per-child=10, --soft-time-limit=6600, --time-limit=7200]
  beat:
    environment: *local-env
    secrets: !reset []
  maintenance:
    profiles: [ops]
    environment:
      <<: *local-env
      BACKUP_ENABLED: '0'
      WORK_ROOT: /var/lib/restore/work
    secrets: !reset []
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:18025:8025']
    networks: [backend, frontend]
    # Runtime SMTP: host=mailpit, port=1025, security=none; it is NOT a real delivery proof.
  localproxy:
    image: ${STATIC_IMAGE:-namelist-static:local}
    platform: linux/amd64
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:size=64m,mode=1777']
    volumes: ['./deploy/local-nginx.conf:/etc/nginx/nginx.conf:ro']
    ports: ['127.0.0.1:18000:8080']
    networks: [frontend]
    depends_on:
      web: {condition: service_healthy}
      static: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/static/vendor/tabler/tabler.min.css']
      interval: 5s
      timeout: 3s
      retries: 12
