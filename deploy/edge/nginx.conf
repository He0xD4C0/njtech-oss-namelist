user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    # OAuth codes and email confirmation tokens must not enter request/referrer logs.
    log_format namelist '$remote_addr "$request_method" $status $body_bytes_sent $request_time';
    access_log /dev/stdout namelist;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # conf.d is deliberately NOT included: the official image's default UI proxy lives there.
    include /etc/nginx/sites-enabled/*;
}
