name: Dev CI
on:
  push:
    tags: ['dev-*']
permissions:
  contents: read
concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions: {contents: read, packages: write}
    strategy:
      fail-fast: false
      matrix: {target: [web, scanner, maintenance, postgres]}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: GHCR login
        env: {GH_TOKEN: '${{ github.token }}'}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:ci-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
      - name: Record immutable digest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TARGET: ${{ matrix.target }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: python scripts/ci_manifest.py image "$TARGET" "$IMAGE_NAME@$DIGEST" "$GITHUB_SHA" "$SOURCE_TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: 'image-${{ matrix.target }}-${{ github.run_attempt }}', path: image.json, retention-days: 90}
  bundle:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {pattern: 'image-*-${{ github.run_attempt }}', path: digests}
      - name: Package CI bundle
        env:
          SOURCE_TAG: ${{ github.ref_name }}
        run: python scripts/ci_manifest.py bundle digests ci-bundle.tar.gz "$GITHUB_SHA" "$SOURCE_TAG" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: ci-bundle, path: ci-bundle.tar.gz, retention-days: 90, overwrite: true}
