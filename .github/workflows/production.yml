name: Promote verified release
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful main Release and staging run ID (no image rebuild)
        required: true
        type: string
      acceptance_reference:
        description: Evidence reference covering real TLS/mail/3 OAuth/Webhooks and isolated restore
        required: true
        type: string
      confirmation:
        description: Type PROMOTE VERIFIED DIGEST after completing the acceptance checklist
        required: true
        type: string
permissions: {contents: read, actions: read}
concurrency: {group: production-release, cancel-in-progress: false}
jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate source run and approval inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          ACCEPTANCE_REFERENCE: ${{ inputs.acceptance_reference }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = 'PROMOTE VERIFIED DIGEST'
          test -n "$ACCEPTANCE_REFERENCE"
          case "$RELEASE_RUN_ID" in ''|*[!0-9]*) exit 64;; esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > run.json
          python deploy/release/manifest.py verify-run run.json
          mkdir release
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release-bundle --dir release
      - name: Deploy previously staged digest
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          RELEASE_ENVIRONMENT: production
          RELEASE_ID: promote-${{ github.run_id }}
          ACCEPTANCE_REFERENCE: ${{ inputs.acceptance_reference }}
        run: bash deploy/release/ssh-deploy.sh
      - name: Record human acceptance reference
        env: {ACCEPTANCE_REFERENCE: '${{ inputs.acceptance_reference }}', RELEASE_RUN_ID: '${{ inputs.release_run_id }}'}
        run: printf 'Promoted release run %s. Acceptance evidence %s\n' "$RELEASE_RUN_ID" "$ACCEPTANCE_REFERENCE" >> "$GITHUB_STEP_SUMMARY"
