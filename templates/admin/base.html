{% extends 'admin/base.html' %}{% load static ui %}
{% block extrahead %}{{ block.super }}
<link rel="icon" type="image/png" data-brand-favicon{% if brand_logo_url %} href="{{ brand_logo_url }}"{% endif %}>
<script src="{% static 'js/theme.js' %}"></script>
<script src="{% static 'js/admin-theme.js' %}"></script>
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
{% include 'bulletins/admin_assets.html' %}
{% endblock %}
{% block header %}{{ block.super }}
<div class="px-4 mb-4 flex justify-end">
<label for="admin-color-mode" class="sr-only">配色模式</label>
<select id="admin-color-mode" data-theme-select class="border border-base-200 rounded-default p-2 bg-white dark:bg-base-900 dark:border-base-700" aria-label="配色模式"><option value="auto">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></div>
{% endblock %}
