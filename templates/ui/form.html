{% load widget_tweaks %}
{% if form.non_field_errors %}<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form.hidden_fields %}{{ field }}{% if field.errors %}<div class="alert alert-danger" role="alert">{{ field.errors }}</div>{% endif %}{% endfor %}
{% for field in form.visible_fields %}{% include 'ui/field.html' %}{% endfor %}
