{% extends 'base.html' %}{% load ui %}{% block content %}<section class="account-shell card"><div class="card-body"><h1>{% ui '邮箱验证' 'Email verification' %}</h1>{% if emailaddresses %}<form method="post" action="{% url 'account_email' %}">{% csrf_token %}{% for address in emailaddresses %}<label class="form-check mb-3"><input class="form-check-input" name="email" type="radio" value="{{ address.email }}" {% if address.primary %}checked{% endif %}><span class="form-check-label">{{ address.email }} {% if address.verified %}<span class="badge bg-green-lt">{% ui '已验证' 'Verified' %}</span>{% else %}<span class="badge bg-orange-lt">{% ui '未验证' 'Unverified' %}</span>{% endif %}</span></label>{% endfor %}<button class="btn btn-primary" name="action_send" type="submit">{% ui '重新发送验证邮件' 'Resend verification' %}</button></form>{% endif %}<div class="account-links"><a href="/account/profile/">{% ui '返回账号设置' 'Account settings' %}</a></div></div></section>{% endblock %}
