{% extends 'base.html' %}{% load ui %}{% block content %}<section class="account-shell card"><div class="card-body"><h1>{% ui '设置新密码' 'Set a new password' %}</h1>{% if token_fail %}<p>{% ui '重置链接无效或已过期。' 'This reset link is invalid or expired.' %}</p><a href="{% url 'account_reset_password' %}">{% ui '重新申请' 'Request another link' %}</a>{% else %}<form class="account-form" method="post" action="{{ action_url }}">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">{% ui '保存密码' 'Save password' %}</button></form>{% endif %}</div></section>{% endblock %}
